# Tests every push and pull request. Then builds emu's image for linux/arm64 (the Server) and
# linux/amd64 (laptops), each on a native runner (no emulation), and smoke-checks it the way the
# Server runs it (scripts/smoke-container.sh). On main it also publishes the image as
#   ghcr.io/bamk74/emu-the-menu:main-<commit unix time>-<short sha>
# The Traquenard Server's bump workflow orders tags by that time. Pattern from
# https://github.com/LorisGitH/wortschatz/blob/5cd65f6/.github/workflows/image.yml, made
# multi-platform as in https://docs.docker.com/build/ci/github-actions/multi-platform/
#
# The first push creates the package private. Set it to public once, by hand, in the package's
# settings on GitHub, or the Server cannot pull it:
# https://docs.github.com/en/packages/learn-github-packages/configuring-a-packages-access-control-and-visibility
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/bamk74/emu-the-menu

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: emu
          POSTGRES_PASSWORD: emu
          POSTGRES_DB: emu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emu -d emu"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      EMU_TEST_DATABASE_URL: postgresql://emu:emu@localhost:5432/emu_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  image:
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # native arm64, free on public repositories
          - platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        run: docker buildx build --platform ${{ matrix.platform }} --load -t emu:test .

      - name: Smoke check (user 10001, read-only, no capabilities, beside Postgres 18)
        run: scripts/smoke-container.sh emu:test

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed without a tag; the publish job gathers both platforms under one.
      - name: Push by digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx build --platform ${{ matrix.platform }} \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file meta.json .
          digest=$(jq -r '."containerimage.digest"' meta.json)
          mkdir -p digests && touch "digests/${digest#sha256:}"
          echo "pushed ${{ matrix.platform }} as ${digest}"

      - name: Keep the digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both platforms as one image
        run: |
          tag="main-$(git show -s --format=%ct HEAD)-$(git rev-parse --short=7 HEAD)"
          refs=()
          for d in digests/*; do refs+=("${IMAGE}@sha256:$(basename "$d")"); done
          [ "${#refs[@]}" = 2 ] || { echo "expected 2 platform digests, got ${#refs[@]}" >&2; exit 1; }
          docker buildx imagetools create -t "${IMAGE}:${tag}" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${tag}"
          {
            echo "### Published \`${IMAGE}:${tag}\`"
            echo
            echo '```'
            docker buildx imagetools inspect "${IMAGE}:${tag}" | grep -E 'Platform' | grep -v unknown
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
