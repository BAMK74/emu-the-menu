[project]
name = "emu-the-menu"
version = "0.1.0"
description = "Self-hosted fridge and pantry tracker that generates menus from calorie goals, weather, stock and occasions."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emu_the_menu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]
