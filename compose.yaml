# A Postgres for running emu and its tests on your own computer: `docker compose up -d`.
# It matches the Traquenard Server's major version. Data lives in the `emu-postgres` volume.
#
# Then:
#   EMU_DATABASE_URL=postgresql://emu:emu@localhost:5432/emu   (the app)
#   EMU_TEST_DATABASE_URL defaults to .../emu_test             (the tests; dropped on each run)
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: emu
      POSTGRES_PASSWORD: emu
      POSTGRES_DB: emu
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - emu-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emu -d emu"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  emu-postgres:
